name: PHP syntax check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql

      - name: Check PHP syntax
        run: |
          set -e
          for f in $(git ls-files "*.php"); do
            php -l "$f"
          done
